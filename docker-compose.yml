name: docflow

# Shared build + environment for the three Python services.
x-app: &app
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-25000000}
    # Flip STORAGE_BACKEND to "s3" to route uploads at MinIO instead of the
    # shared volume. Nothing else changes - the rest of the code only handles
    # an opaque key.
    STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    S3_BUCKET: ${S3_BUCKET:-docflow-uploads}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    # MinIO's local root credentials - NOT real AWS keys. In production these
    # are absent and boto3 resolves an instance role instead.
    AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-docflow}
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-docflowsecret}
  volumes:
    # Source bind-mount for development; uploads is the shared volume that
    # lets the worker read what the API wrote.
    - .:/app
    - uploads:/data/uploads
  restart: unless-stopped

services:
  postgres:
    # pgvector's image is stock Postgres 16 plus the vector extension, used for
    # the embeddings written in Phase 3.
    image: pgvector/pgvector:pg16
    container_name: docflow_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docflow} -d ${POSTGRES_DB:-docflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  minio:
    # Local stand-in for S3, so the S3 backend is exercised for real rather
    # than mocked. Production points at AWS by unsetting S3_ENDPOINT_URL.
    image: minio/minio:latest
    container_name: docflow_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docflowsecret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # One-shot: S3 buckets are not created implicitly on first write.
    image: minio/mc:latest
    container_name: docflow_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-docflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-docflowsecret}
      S3_BUCKET: ${S3_BUCKET:-docflow-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      echo 'bucket ready'"
    restart: "no"

  api:
    <<: *app
    build:
      context: .
      target: api
    container_name: docflow_api
    command: ["sh", "/app/scripts/start-api.sh", "--reload"]
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    build:
      context: .
      target: ${WORKER_TARGET:-dev}
    container_name: docflow_worker
    # init gives PID 1 proper signal handling so Celery gets a warm shutdown.
    init: true
    # Drains the priority queues in strict order (queue_order_strategy), so
    # `high` is emptied before `default` is touched. Notably NOT subscribed to
    # `ocr`: a 60s scan must never sit in front of a 2ms extraction.
    command: >
      celery -A worker.celery_app worker --loglevel=INFO
      --concurrency=${WORKER_CONCURRENCY:-4} -Q high,default,low -E
      --hostname=fast@%h
    depends_on:
      # Gating on the API being healthy also guarantees migrations have run,
      # since the API only serves after `alembic upgrade head` succeeds.
      api:
        condition: service_healthy

  worker-ocr:
    <<: *app
    build:
      context: .
      target: ${WORKER_TARGET:-dev}
    container_name: docflow_worker_ocr
    init: true
    # A dedicated pool for the one genuinely slow stage. Concurrency 1 because
    # tesseract is CPU-bound and already multi-threaded internally - stacking
    # them just makes every scan slower.
    command: >
      celery -A worker.celery_app worker --loglevel=INFO
      --concurrency=${OCR_CONCURRENCY:-1} -Q ocr -E
      --hostname=ocr@%h
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *app
    build:
      context: .
      # Celery's `imports` setting makes every `celery -A` entrypoint
      # load worker.tasks, so beat and flower need the processing
      # dependencies too - not just the worker pools. Only the API
      # itself, which is the service that scales horizontally, runs
      # on the lean image.
      target: ${WORKER_TARGET:-dev}
    container_name: docflow_beat
    init: true
    # Schedules the stale-job reaper. Keep exactly one beat instance
    # running - two would double-fire every scheduled task.
    command: >
      celery -A worker.celery_app beat --loglevel=INFO
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_healthy

  flower:
    <<: *app
    build:
      context: .
      # Celery's `imports` setting makes every `celery -A` entrypoint
      # load worker.tasks, so beat and flower need the processing
      # dependencies too - not just the worker pools. Only the API
      # itself, which is the service that scales horizontally, runs
      # on the lean image.
      target: ${WORKER_TARGET:-dev}
    container_name: docflow_flower
    init: true
    # Basic auth covers the UI and the REST API together, which is why
    # FLOWER_UNAUTHENTICATED_API is gone. Change the credentials before this is
    # reachable from anywhere but localhost - Flower can revoke and terminate
    # tasks, so it is an admin surface, not a status page.
    command: >
      celery -A worker.celery_app flower --address=0.0.0.0 --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${FLOWER_PORT:-5556}:5555"
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Inlined into the client bundle at build time, so it must be an
        # address the browser can reach - not the internal http://api:8000.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
    container_name: docflow_frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  miniodata:
  pgdata:
  redisdata:
  uploads:
