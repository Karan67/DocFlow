name: docflow

# Shared build + environment for the three Python services.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}
    REDIS_URL: redis://redis:6379/0
    UPLOAD_DIR: /data/uploads
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-25000000}
  volumes:
    # Source bind-mount for development; uploads is the shared volume that
    # lets the worker read what the API wrote.
    - .:/app
    - uploads:/data/uploads
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    container_name: docflow_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docflow} -d ${POSTGRES_DB:-docflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docflow_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    <<: *app
    container_name: docflow_api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  worker:
    <<: *app
    container_name: docflow_worker
    # init gives PID 1 proper signal handling so Celery gets a warm shutdown.
    init: true
    command: celery -A worker.celery_app worker --loglevel=INFO --concurrency=2 -Q default -E
    depends_on:
      # Gating on the API being healthy also guarantees migrations have run,
      # since the API only serves after `alembic upgrade head` succeeds.
      api:
        condition: service_healthy

  flower:
    <<: *app
    container_name: docflow_flower
    init: true
    command: celery -A worker.celery_app flower --address=0.0.0.0 --port=5555
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-docflow}:${POSTGRES_PASSWORD:-docflow}@postgres:5432/${POSTGRES_DB:-docflow}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Local-dev convenience: exposes Flower's REST API without a login.
      # Must NOT be set on a publicly reachable deployment (Phase 6).
      FLOWER_UNAUTHENTICATED_API: "true"
    ports:
      - "${FLOWER_PORT:-5556}:5555"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
